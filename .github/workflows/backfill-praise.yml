name: Backfill the praise tip

# Gives every approved sentence that has no tip Scribbles' praise ("Great
# picture! Keep painting with words."), so students see it on sentences
# approved before tips existed (backend/utils/backfillPraise.ts). Run it from
# the Actions tab with "Run workflow".
#
# - "apply" unticked (the default): only counts, changes nothing.
# - "apply" ticked: adds the praise tip. It never changes a sentence that has
#   a tip or isn't approved, so running it twice is harmless.
# - Production asks for the production approval first, like a promotion.
#
# Prints counts only, never a student's words.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which database
        type: choice
        options:
          - staging
          - production
        default: staging
      apply:
        description: Add the praise tip (unticked = count only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backfill-praise
  cancel-in-progress: false

jobs:
  staging:
    name: Staging
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # keep in sync with "engines" in backend/package.json
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Staging's database login only reaches the practice database
      - name: Backfill
        env:
          DATABASE_ACCESS: ${{ secrets.STAGING_DATABASE_ACCESS }}
          DATABASE_NAME: ShowME-dev
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: node lib/scripts/backfill-praise.js $APPLY

  production:
    name: Production
    if: ${{ inputs.target == 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The "production" environment asks a required reviewer to approve first
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # keep in sync with "engines" in backend/package.json
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The production database, as the production backend reads it (the one
      # named in DATABASE_ACCESS)
      - name: Backfill
        env:
          DATABASE_ACCESS: ${{ secrets.DATABASE_ACCESS }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: node lib/scripts/backfill-praise.js $APPLY
