name: Judge the sense practice sets

# Decides the judgment calls in the sense practice sets
# (client/src/test/senseSet.ts and senseHeldOut.ts, made-up sentences only):
# senses a sentence isn't labeled with, but that most teachers would accept
# ("crunchy chips" is a sound too). Three AI families other than the
# tagger's each answer for every sense a sentence's labels leave out, and
# only a unanimous yes counts (client/scripts/judgeSenseSets.ts). Stage A7
# of tasks/sense-words-plan.md: no person decides, and the AI being measured
# doesn't grade itself.
#
# Run it from the Actions tab with "Run workflow", once for each set, on
# different days: the judges think before answering (about 67 Neurons a
# sentence), so the tuning set uses about 6,500 of Cloudflare's 10,000 free
# daily Neurons and the held-out set about 2,700. "Try" (3 sentences,
# printing each judge's raw answer) checks the models answer as expected.
# Each run's log ends with the new client/src/test/senseMay.ts, with that
# set's answers and the other's kept, to be committed in a pull request and
# frozen from then on.
on:
  workflow_dispatch:
    inputs:
      set:
        description: Which practice set to judge
        type: choice
        options:
          - tuning
          - held-out
        default: tuning
      try:
        description: Only 3 sentences, printing each judge's raw answer; writes nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: judge-sense-sets
  cancel-in-progress: false

jobs:
  judge:
    name: Judge
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # keep in sync with "engines" in backend/package.json
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            client/package-lock.json

      # It reuses the backend's Cloudflare helpers; their packages come from there
      - name: Install Dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix client

      - name: Judge
        working-directory: client
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          SET: ${{ inputs.set }}
          TRY: ${{ inputs.try && '--try' || '' }}
        run: npx tsx scripts/judge-sense-sets.ts "--set=$SET" $TRY
