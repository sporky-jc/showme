name: Judge the sense practice sets

# Decides the judgment calls in the sense practice sets
# (client/src/test/senseSet.ts and senseHeldOut.ts, made-up sentences only):
# senses a sentence isn't labeled with, but that most teachers would accept
# ("crunchy chips" is a sound too). Three AI families other than the
# tagger's each answer for every sense a sentence's labels leave out, and
# only a unanimous yes counts (client/scripts/judgeSenseSets.ts). Stage A7
# of tasks/sense-words-plan.md: no person decides, and the AI being measured
# doesn't grade itself.
#
# Run it from the Actions tab with "Run workflow", once for each set, on
# different days: the judges think before answering (about 67 Neurons a
# sentence), so the tuning set uses about 6,500 of Cloudflare's 10,000 free
# daily Neurons and the held-out set about 2,700. "Try" (3 sentences,
# printing each judge's raw answer) checks the models answer as expected.
# Each run's log ends with the new client/src/test/senseMay.ts, with that
# set's answers and the other's kept, to be committed in a pull request and
# frozen from then on.
#
# Runs on made-up sentences only, on the sense Cloudflare account (secrets
# CLOUDFLARE_SENSE_ACCOUNT_ID and CLOUDFLARE_SENSE_AI_TOKEN, a token with
# only the Workers AI permission), the one the tagger uses, so Scribbles'
# free Neurons are never touched. Without both, the test account (its
# earlier name, CLOUDFLARE_TEST_*), else the main one.
on:
  workflow_dispatch:
    inputs:
      set:
        description: Which practice set to judge
        type: choice
        options:
          - tuning
          - held-out
        default: tuning
      try:
        description: Only 3 sentences, printing each judge's raw answer; writes nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: judge-sense-sets
  cancel-in-progress: false

jobs:
  judge:
    name: Judge
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # keep in sync with "engines" in backend/package.json
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            client/package-lock.json

      # It reuses the backend's Cloudflare helpers; their packages come from there
      - name: Install Dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix client

      # Which Cloudflare account this run uses (never its id)
      - name: Say which Cloudflare account
        env:
          SENSE_ACCOUNT: ${{ secrets.CLOUDFLARE_SENSE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_SENSE_AI_TOKEN != '' }}
          TEST_ACCOUNT: ${{ secrets.CLOUDFLARE_TEST_ACCOUNT_ID != '' && secrets.CLOUDFLARE_TEST_AI_TOKEN != '' }}
        run: |
          if [ "$SENSE_ACCOUNT" = "true" ]; then
            echo "Using the sense Cloudflare account (CLOUDFLARE_SENSE_ACCOUNT_ID), shared with the tagger, not Scribbles."
          elif [ "$TEST_ACCOUNT" = "true" ]; then
            echo "Using the test Cloudflare account (CLOUDFLARE_TEST_ACCOUNT_ID): its own 10,000 free Neurons a day."
          else
            echo "Using the main Cloudflare account: its free Neurons are shared with staging's tagger and Scribbles."
          fi

      - name: Judge
        working-directory: client
        env:
          # The sense account when both its secrets are set, else the test
          # account (the same thing, by its earlier name), else the main one
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_SENSE_ACCOUNT_ID && secrets.CLOUDFLARE_SENSE_AI_TOKEN && secrets.CLOUDFLARE_SENSE_ACCOUNT_ID || secrets.CLOUDFLARE_TEST_ACCOUNT_ID && secrets.CLOUDFLARE_TEST_AI_TOKEN && secrets.CLOUDFLARE_TEST_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_SENSE_ACCOUNT_ID && secrets.CLOUDFLARE_SENSE_AI_TOKEN && secrets.CLOUDFLARE_SENSE_AI_TOKEN || secrets.CLOUDFLARE_TEST_ACCOUNT_ID && secrets.CLOUDFLARE_TEST_AI_TOKEN && secrets.CLOUDFLARE_TEST_AI_TOKEN || secrets.CLOUDFLARE_AI_TOKEN }}
          SET: ${{ inputs.set }}
          TRY: ${{ inputs.try && '--try' || '' }}
        run: npx tsx scripts/judge-sense-sets.ts "--set=$SET" $TRY
