name: Measure the AI reviewer

# Runs the AI reviewer (safety check and AI review) on made-up sample
# sentences (backend/reviewer/samples.ts), never on real students' writing,
# and shows how often it agreed with a teacher in the run's summary. Run it
# from the Actions tab with "Run workflow", after setting up the keys
# (docs/ai-reviewer-setup.md). Uses about 1,300 of Cloudflare's 10,000 free
# daily Neurons per run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measure-reviewer
  cancel-in-progress: false

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # keep in sync with "engines" in backend/package.json
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Measure
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_REVIEW_MODEL: ${{ vars.CLOUDFLARE_REVIEW_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REVIEWER_USE_GROQ: ${{ vars.REVIEWER_USE_GROQ }}
        run: node lib/scripts/measure-reviewer.js
