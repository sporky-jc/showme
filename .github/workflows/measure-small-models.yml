name: Measure small open models

# Could small open models, run on a machine of our own, do the first read of
# a sentence for Scribbles? This scores them on the same made-up samples as
# "Measure the AI reviewer" (backend/reviewer/samples.ts), with the same
# questions, and shows the result in the run's summary: how often each
# agreed with a teacher, whether it approved anything it shouldn't, how many
# unsafe sentences it held, and how long it took.
#
# No real student's writing, no keys, no database, nothing paid: the models
# run inside this job (Ollama, in a container), on GitHub's free ARM runner,
# which is the same kind of machine as the VM they would run on. One job per
# model, side by side: a model whose name is wrong, or that can't answer in
# the fixed form, fails or scores badly by itself. Run it from the Actions
# tab with "Run workflow". It also runs on a pull request that changes this
# file or the local models' code, with the default models, so a change to
# either is tried before it's merged.
#
# The default models are in two places below (the inputs and the matrix):
# keep them the same.
on:
  workflow_dispatch:
    inputs:
      models:
        description: Models to try as the reviewer and welfare check (a JSON list of Ollama names)
        default: '["qwen3.5:9b","qwen3:8b","gemma4:e4b","llama3.1:8b"]'
      safety_model:
        description: The safety check's model (an Ollama name)
        default: llama-guard3:8b
  pull_request:
    paths:
      - .github/workflows/measure-small-models.yml
      - backend/reviewer/providers/local.ts

permissions:
  contents: read

concurrency:
  group: measure-small-models-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: ${{ matrix.model }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.models || '["qwen3.5:9b","qwen3:8b","gemma4:e4b","llama3.1:8b"]') }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # keep in sync with "engines" in backend/package.json
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Started here, not as a service: a service's whole log is printed at
      # the end of the job, and Ollama's is thousands of lines
      - name: Start Ollama
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:0.40.14
          for try in $(seq 1 30); do
            curl -fsS http://localhost:11434/api/version && exit 0
            sleep 2
          done
          echo "Ollama didn't start" && exit 1

      # The names go in as data (jq), never into the command itself
      - name: Download the models
        env:
          MODEL: ${{ matrix.model }}
          SAFETY_MODEL: ${{ inputs.safety_model || 'llama-guard3:8b' }}
        run: |
          for name in "$MODEL" "$SAFETY_MODEL"; do
            echo "Downloading $name"
            jq -n --arg model "$name" '{model: $model, stream: false}' |
              curl -fsS --retry 3 --max-time 1800 http://localhost:11434/api/pull -d @-
            echo
          done

      - name: Measure
        env:
          LOCAL_AI_URL: http://localhost:11434
          LOCAL_REVIEW_MODEL: ${{ matrix.model }}
          LOCAL_SAFETY_MODEL: ${{ inputs.safety_model || 'llama-guard3:8b' }}
        run: node lib/scripts/measure-reviewer.js
