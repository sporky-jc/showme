name: Measure the sense tagger

# Runs the sense tagger's two AI models (backend/tagger/) on the made-up
# labeled sentences in client/src/test/ (the 97 it's tuned on, and 40 held
# out that it never is), never on real students' writing, and shows in the
# run's summary how the Gallery's highlights would score with them, against
# the word list alone: how many senses they find, how often they're right,
# how often the two models agree, and the Neurons used. Judgment calls
# (senseMay.ts) count neither way. Stages A4 and A7 of
# tasks/sense-words-plan.md. Run it from the Actions tab with "Run workflow",
# before showing AI highlights to kids in production: both sets must pass.
# Uses about 4,500 of Cloudflare's 10,000 free daily Neurons per run.
#
# Runs on made-up sentences only, on the sense Cloudflare account (secrets
# CLOUDFLARE_SENSE_ACCOUNT_ID and CLOUDFLARE_SENSE_AI_TOKEN, a token with
# only the Workers AI permission), the one the tagger uses, so Scribbles'
# free Neurons are never touched. Without both, the test account (its
# earlier name, CLOUDFLARE_TEST_*), else the main one.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measure-tagger
  cancel-in-progress: false

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # keep in sync with "engines" in backend/package.json
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            client/package-lock.json

      # The tagger's code is the backend's; its packages come from there
      - name: Install Dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix client

      # Which Cloudflare account this run uses (never its id)
      - name: Say which Cloudflare account
        env:
          SENSE_ACCOUNT: ${{ secrets.CLOUDFLARE_SENSE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_SENSE_AI_TOKEN != '' }}
          TEST_ACCOUNT: ${{ secrets.CLOUDFLARE_TEST_ACCOUNT_ID != '' && secrets.CLOUDFLARE_TEST_AI_TOKEN != '' }}
        run: |
          if [ "$SENSE_ACCOUNT" = "true" ]; then
            echo "Using the sense Cloudflare account (CLOUDFLARE_SENSE_ACCOUNT_ID), shared with the tagger, not Scribbles."
          elif [ "$TEST_ACCOUNT" = "true" ]; then
            echo "Using the test Cloudflare account (CLOUDFLARE_TEST_ACCOUNT_ID): its own 10,000 free Neurons a day."
          else
            echo "Using the main Cloudflare account: its free Neurons are shared with staging's tagger and Scribbles."
          fi

      - name: Measure
        working-directory: client
        env:
          # The sense account when both its secrets are set, else the test
          # account (the same thing, by its earlier name), else the main one
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_SENSE_ACCOUNT_ID && secrets.CLOUDFLARE_SENSE_AI_TOKEN && secrets.CLOUDFLARE_SENSE_ACCOUNT_ID || secrets.CLOUDFLARE_TEST_ACCOUNT_ID && secrets.CLOUDFLARE_TEST_AI_TOKEN && secrets.CLOUDFLARE_TEST_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_SENSE_ACCOUNT_ID && secrets.CLOUDFLARE_SENSE_AI_TOKEN && secrets.CLOUDFLARE_SENSE_AI_TOKEN || secrets.CLOUDFLARE_TEST_ACCOUNT_ID && secrets.CLOUDFLARE_TEST_AI_TOKEN && secrets.CLOUDFLARE_TEST_AI_TOKEN || secrets.CLOUDFLARE_AI_TOKEN }}
        run: npx tsx scripts/measure-tagger.ts
