name: Refresh QA Wolf's test-login pass

# Keeps a fresh short-lived pass in QA Wolf's staging environment (as its
# TEST_LOGIN_SECRET variable), so any QA Wolf run can sign in through the
# staging test login, however it was started: by a deploy, by hand, or by the
# QA Wolf AI building or repairing a flow. Each pass lasts 24 hours. This is
# scheduled every hour, but GitHub has run it only every 6 to 10 hours, so
# the pass has to outlast those gaps; a pass that leaks still stops working
# within a day. See .github/scripts/test-login-pass.mjs.
#
# GitHub runs schedules from the default branch (staging), sometimes late,
# and turns them off in a public repository after 60 days without activity
# (the Actions tab then offers to turn this one back on). Runs a deployment
# starts are unaffected; the others need a saved pass. "Run workflow"
# refreshes it at once, for example after QA Wolf's sign-in flows fail with
# "Invalid test login secret".
on:
  schedule:
    - cron: "23 * * * *" # every hour, off the busy top of the hour
  workflow_dispatch:

# Never two refreshes at once; a newer pass replaces an older one anyway
concurrency:
  group: refresh-qawolf-test-pass
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Save a new pass in QA Wolf
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Save a new test-login pass in QA Wolf
        env:
          TEST_LOGIN_KEY: ${{ secrets.TEST_LOGIN_KEY }}
          QAWOLF_API_KEY: ${{ secrets.QAWOLF_API_KEY }}
        run: node .github/scripts/test-login-pass.mjs save
