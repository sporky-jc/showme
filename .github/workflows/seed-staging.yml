name: Fill staging with sample data

# Replaces staging's made-up sample students and sentences
# (backend/utils/sampleData.ts), so every page has realistic things to show:
# the Gallery, sent-back sentences with Scribbles' tips, approved ones with
# his praise, and a Teacher page queue with every kind of Scribbles note.
# Then Scribbles reviews the waiting sample sentences straight away, as the
# scheduled reviewer would. Run it from the Actions tab with "Run workflow".
#
# Staging only: staging's database login can only reach the practice
# database (ShowME-dev), and the script refuses the production one. It only
# deletes the sample data it created itself, never anyone else's sentences.
# QA Wolf's test teacher only sees test accounts' sentences, so its flows
# don't see the sample data. Uses about 400 of Cloudflare's 10,000 free daily
# Neurons per run.
#
# "account": optionally, the email of your own staging account. It gets
# sample sentences in every state on My sentences (approved with praise, sent
# back with and without a tip, waiting) and becomes a teacher, so signing in
# with it shows how everything looks. It must have signed in to staging once.
# Its own sentences are never touched. The email isn't stored in the code,
# and it's masked in the log (it still shows in the run's inputs, which only
# people with access to the repository can see).
on:
  workflow_dispatch:
    inputs:
      account:
        description: Your staging account's email (optional), to give it sample sentences and make it a teacher
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: seed-staging
  cancel-in-progress: false

jobs:
  seed:
    name: Seed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # keep in sync with "engines" in backend/package.json
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The email is read from the run's event file and masked before any
      # step prints it: a step's env block is printed with its values, so it
      # never goes in one unmasked
      - name: Hide the account's email in the log
        run: |
          account="$(jq -r '.inputs.account // ""' "$GITHUB_EVENT_PATH")"
          if [ -n "$account" ]; then
            echo "::add-mask::$account"
            echo "ACCOUNT=$account" >> "$GITHUB_ENV"
          fi

      - name: Seed and review
        env:
          DATABASE_ACCESS: ${{ secrets.STAGING_DATABASE_ACCESS }}
          DATABASE_NAME: ShowME-dev
          REVIEWER_MODE: suggest
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_REVIEW_MODEL: ${{ vars.CLOUDFLARE_REVIEW_MODEL }}
        run: |
          if [ -n "${ACCOUNT:-}" ]; then
            node lib/scripts/seed-dev.js --review --demo "$ACCOUNT"
          else
            node lib/scripts/seed-dev.js --review
          fi
