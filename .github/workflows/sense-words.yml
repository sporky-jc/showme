name: Weekly sense words

# Grows the sense word list (client/src/senses.ts) from the words kids write
# (S3 of tasks/sense-words-plan.md, which has the gates every word must
# pass). Once a week it:
# 1. counts the words in approved Show sentences
#    (backend/scripts/sense-word-counts.ts): only single words, each in at
#    least 3 sentences by 3 different kids answering 2 different Tells,
#    real English words, never a name, and passing Scribbles' safety checks;
# 2. asks two different free Cloudflare Workers AI models which sense each
#    word the list doesn't know uses, keeps the words both agree on (and
#    that aren't blocked), and keeps only those every sense test still
#    passes with (client/scripts/sense-words.ts). It also takes out any
#    added word now in NEVER_ADD;
# 3. opens a pull request into staging with the qa-wolf label, changing
#    only client/src/senseWordsAdded.ts. If last week's is still open, it
#    rebuilds that one from current staging instead.
#
# Reads staging's database only, for now. Free: Cloudflare's daily free
# Neurons (on the Workers Free plan, going over fails and is never billed)
# and GitHub Actions minutes. Only single words are sent to the AI.
#
# Needs the SENSE_WORDS_TOKEN secret: a fine-grained GitHub token for this
# repository only, with Contents, Pull requests and Issues set to read and
# write. (A pull request opened with the workflow's own token wouldn't start
# CI or QA Wolf.) A dry run doesn't need it. Also uses CLOUDFLARE_ACCOUNT_ID,
# CLOUDFLARE_AI_TOKEN and STAGING_DATABASE_ACCESS, as other workflows do.
#
# Upgrade later: swap the token for a GitHub App installed on this
# repository only, minting a short-lived token each run with
# actions/create-github-app-token (see the plan's S3 risks). Only the token
# steps change.
# Run by hand only, for now: Stage A5 of the plan reworks it to learn from
# the words two models agree on in each sentence, and turns the weekly
# schedule on (Sundays, 18:23 UTC: cron '23 18 * * 0').
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Ask the AI and report, but change nothing
        type: boolean
        default: false

permissions:
  contents: read
  # To switch this workflow's own schedule back on (the last step)
  actions: write

concurrency:
  group: sense-words
  cancel-in-progress: false

env:
  BRANCH_PREFIX: sense-words/

jobs:
  words:
    name: Find new sense words
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check the token is set
        if: ${{ !inputs.dry_run }}
        env:
          SENSE_WORDS_TOKEN: ${{ secrets.SENSE_WORDS_TOKEN }}
        run: |
          if [ -z "$SENSE_WORDS_TOKEN" ]; then
            echo "::error::Add the SENSE_WORDS_TOKEN secret first (see the top of this workflow)."
            exit 1
          fi

      - name: Checkout staging
        uses: actions/checkout@v7
        with:
          ref: staging
          token: ${{ inputs.dry_run && github.token || secrets.SENSE_WORDS_TOKEN }}

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # keep in sync with "engines" in backend/package.json
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            client/package-lock.json

      - name: Count the words in approved sentences
        working-directory: backend
        env:
          DATABASE_ACCESS: ${{ secrets.STAGING_DATABASE_ACCESS }}
          DATABASE_NAME: ShowME-dev
        run: |
          npm ci
          npm run build
          node lib/scripts/sense-word-counts.js "$RUNNER_TEMP/counts.json"

      - name: Ask the AI, and keep the words the tests pass with
        id: ask
        working-directory: client
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          DATABASE_LABEL: staging
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          npm ci
          npx tsx scripts/sense-words.ts "$RUNNER_TEMP/counts.json" "$RUNNER_TEMP/report.md" $DRY_RUN

      # One job pull request at a time: rebuild last week's if it's open
      - name: Open or update the pull request
        if: ${{ !inputs.dry_run && steps.ask.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SENSE_WORDS_TOKEN }}
          ADDED: ${{ steps.ask.outputs.added }}
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base staging --json number,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"$BRANCH_PREFIX\"))][0] // empty")
          if [ -n "$open" ]; then
            branch=$(echo "$open" | jq -r .headRefName)
            number=$(echo "$open" | jq -r .number)
          else
            branch="${BRANCH_PREFIX}$(date -u +%Y-%m-%d)"
          fi
          title="Sense words: $ADDED new words from the weekly job"
          git config user.name "Show ME sense words"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add client/src/senseWordsAdded.ts
          git commit -m "$title"
          # The job's own branch, rebuilt from staging each week
          git push --force origin "$branch"
          if [ -n "$open" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/report.md"
          else
            gh pr create --base staging --head "$branch" --title "$title" \
              --body-file "$RUNNER_TEMP/report.md" --label qa-wolf
          fi

      # GitHub turns off scheduled workflows in a public repository after 60
      # days without commits. Switching it back on each run restarts that.
      - name: Keep the weekly schedule on
        if: ${{ always() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sense-words.yml/enable"
